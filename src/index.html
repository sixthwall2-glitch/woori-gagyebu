<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집 가계부</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141716" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Layout: 휴대폰 앱처럼 한 화면씩 전환. 달력(홈) → 금액·사용자 → 메모·카테고리. 넓은 화면에서는 가운데 460px 열. */
:root{
  --bg:#ffffff; --sub:#f4f5f5; --ink:#1c1f1e; --muted:#8a908e; --faint:#b8bdbb; --line:#ebeeed;
  --accent:#14a3a8; --dark:#161818; --on-dark:#ffffff; --out:#1c1f1e; --in:#2f6fd6; --danger:#d64545;
  --font:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141716; --sub:#1e2221; --ink:#eef1f0; --muted:#97a09d; --faint:#5d6663; --line:#262b2a;
  --accent:#3cc4c8; --dark:#eef1f0; --on-dark:#141716; --out:#eef1f0; --in:#7fa9f0; --danger:#f07c7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141716; --sub:#1e2221; --ink:#eef1f0; --muted:#97a09d; --faint:#5d6663; --line:#262b2a;
  --accent:#3cc4c8; --dark:#eef1f0; --on-dark:#141716; --out:#eef1f0; --in:#7fa9f0; --danger:#f07c7c; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
/* 상단 상태바(시계·배터리) 영역을 배경색으로 덮어, 스크롤한 내용이 그 뒤로 비치지 않게 한다 */
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--safe-area-inset-top,env(safe-area-inset-top,0px));background:var(--bg);z-index:15;pointer-events:none}
body{overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.screen{display:flex;flex-direction:column;flex:1}

/* 헤더 */
.hdr{display:flex;align-items:center;justify-content:space-between;padding-block:18px 14px;gap:8px}
.month-btn{display:flex;align-items:center;gap:6px;font-size:1.55rem;font-weight:500;letter-spacing:-.02em}
.month-btn svg{width:20px;height:20px;color:var(--muted)}
.hdr-icons{display:flex;gap:14px}
.hdr-icons button{width:38px;height:38px;display:grid;place-items:center}
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-block:16px 10px}
.bar h1{margin:0;text-align:center;font-size:1.12rem;font-weight:500}
.bar button{width:44px;height:44px;display:grid;place-items:center}

/* 요약 */
.summary{background:var(--sub);border-radius:16px;display:grid;grid-template-columns:1fr 1.6fr 1fr;padding-block:14px;text-align:center;gap:4px}
.summary .k{font-size:.82rem;color:var(--muted)}
.summary .v{font-size:.95rem;margin-top:2px}

/* 월 선택 */
.picker{background:var(--sub);border-radius:14px;padding:12px;margin-top:4px;display:grid;gap:10px}
.picker .yr{display:flex;justify-content:space-between;align-items:center;font-weight:500}
.picker .yr button{width:36px;height:32px}
.picker .ms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.picker .ms button{padding:8px 0;border-radius:10px;background:var(--bg)}
.picker .ms button[aria-current="true"]{background:var(--dark);color:var(--on-dark)}

/* 달력 */
.cal{margin-top:18px;border-top:1px solid var(--line)}
.dow,.week{display:grid;grid-template-columns:var(--lab) repeat(7,minmax(0,1fr))}
.cal{--lab:62px}
.dow{font-size:.75rem;color:var(--muted);text-align:center;padding-block:8px}
.dow span:nth-child(2){color:var(--danger)}
.week{border-bottom:1px solid var(--line)}
.day{height:78px;display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:1px;min-width:0}
.day .d{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:1.05rem}
.day.hol .d{color:var(--faint)}
.day.sel .d{background:var(--dark);color:var(--on-dark)}
.day.today:not(.sel) .d{box-shadow:inset 0 0 0 1.5px var(--line)}
.day .amt{font-size:.6rem;line-height:14px;letter-spacing:-.03em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day .amt.in{color:var(--in)}

/* 선택한 날 내역 */
.daylist{background:var(--sub);flex:1;padding-block:14px 30px;display:flex;flex-direction:column;gap:6px}
.daytitle{font-size:.82rem;color:var(--muted);margin-bottom:4px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:8px 0;text-align:left;width:100%}
.ic{width:56px;height:56px;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}
.row .t{font-size:1.02rem;display:flex;align-items:center;gap:6px;min-width:0}
.row .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t svg{width:18px;height:18px;flex:none;color:var(--muted)}
.row .s{font-size:.82rem;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:2px}
.chip{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:.76rem;color:var(--faint);background:var(--bg)}
.row .a{font-size:1.02rem}
.row .a.in{color:var(--in)}
.empty{color:var(--muted);text-align:center;padding:18px 0 8px;font-size:.9rem}
.cta{align-self:center;margin-top:18px;background:var(--dark);color:var(--on-dark);border-radius:999px;padding:15px 52px;font-size:1.05rem}

/* 입력 행 */
.field{display:grid;grid-template-columns:30px 1fr;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding-block:20px;position:relative}
.field svg{width:28px;height:28px}
.field input{border:0;background:transparent;font:inherit;font-size:1.15rem;color:var(--ink);width:100%;min-width:0;padding:0}
.field input::placeholder{color:var(--faint)}
.field .val{font-size:1.15rem;color:var(--faint)}
.field input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer}
.field.dim svg,.field.dim .val{color:var(--faint)}
.field input:focus-visible,.login input:focus-visible{outline:none;border-color:var(--accent)}
.amount-in{font-size:1.4rem!important}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding-block:14px;padding-left:50px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.92rem}
.sw{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--bg);transition:transform .2s;box-shadow:0 1px 2px rgb(0 0 0 / .2)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 0 50px}
.sugg button{background:var(--sub);border-radius:999px;padding:5px 12px;font-size:.85rem}

/* 아이콘 그리드 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;padding-block:28px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.9rem;min-width:0}
.tile .c{width:68px;height:68px;border-radius:50%;background:var(--sub);display:grid;place-items:center;transition:background .15s}
.tile .c svg{width:34px;height:34px}
.tile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile[aria-pressed="true"] .c{background:var(--dark);color:var(--on-dark)}
.tabs{display:flex;justify-content:center;align-items:center;gap:14px;font-size:1.25rem}
.tabs button{color:var(--faint);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1.5px}
.tabs button[aria-pressed="true"]{color:var(--accent)}
.tabs i{color:var(--faint);font-style:normal}
.msg{min-height:1.4em;font-size:.88rem;color:var(--danger);padding-top:8px}
.danger{color:var(--danger);border:1px solid var(--line);border-radius:999px;padding:10px 22px;align-self:center;margin-bottom:24px}
.danger.confirm{background:var(--danger);color:var(--bg);border-color:var(--danger)}

/* 시트 / 기타 화면 */
.sheet{background:var(--sub);border-radius:16px;padding:16px;display:grid;gap:12px;margin-bottom:18px}
.sheet label{display:grid;gap:6px;font-size:.82rem;color:var(--muted)}
.sheet input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box;min-width:0}
.avatars{display:flex;flex-wrap:wrap;gap:8px}
.avatars button{width:46px;height:46px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.avatars button[aria-pressed="true"]{background:var(--dark);color:var(--on-dark)}
.btns{display:flex;gap:8px;justify-content:flex-end}
.pill{background:var(--dark);color:var(--on-dark);border-radius:999px;padding:9px 20px}
.pill.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.section{padding-block:6px 20px}
.section h2{font-size:.82rem;color:var(--muted);font-weight:500;margin:0 0 12px}
.brow{display:grid;grid-template-columns:5.2em minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem;padding-block:5px}
.track{height:8px;background:var(--sub);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.track i.over{background:var(--danger)}
.mrow{display:flex;align-items:center;gap:10px;padding-block:6px}
.mrow input{flex:1}
.mrow .rm{color:var(--danger);font-size:.85rem;padding:6px}
.listday h3{font-size:.82rem;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;margin:16px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.banner{background:var(--sub);border-radius:12px;padding:10px 14px;font-size:.86rem;color:var(--muted);margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));transform:translateX(-50%);background:var(--dark);color:var(--on-dark);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:20;max-width:calc(100% - 40px)}
@media (prefers-reduced-motion:reduce){.sw,.sw::after,.tile .c{transition:none}}

/* 하루 예산 */
.budget{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px;margin-bottom:12px}
.budget .bk{font-size:.82rem;color:var(--muted)}
.budget .bv{font-size:1.6rem;font-weight:600;letter-spacing:-.02em}
.budget .bv.over{color:var(--danger)}
.budget .track{height:7px;margin-block:2px}
.budget .bd{font-size:.8rem;color:var(--muted)}
.lab{display:flex;flex-direction:column;align-items:flex-start;padding:6px 0 0 max(6px,env(safe-area-inset-left,0px));gap:1px;min-width:0;overflow:hidden}
.lab i{height:34px}
.lab span{font-size:.54rem;line-height:14px;color:var(--muted);white-space:nowrap;letter-spacing:-.04em}
.lab span:first-of-type{color:var(--ink);font-weight:500}
.day .amt.avail{color:var(--ink);font-weight:500}
.day .amt.over{color:var(--danger)}
/* 로그인 */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:40px}
.login .logo{width:72px;height:72px;border-radius:20px}
.login h1{margin:0;font-size:1.6rem;font-weight:600;letter-spacing:-.02em}
.login p{margin:6px 0 0;color:var(--muted);font-size:.92rem}
.login form{display:grid;gap:12px}
.login input{font:inherit;font-size:1.05rem;color:var(--ink);background:var(--sub);border:1px solid var(--line);border-radius:12px;padding:14px;width:100%;min-width:0}
.login .cta{align-self:stretch;margin-top:6px}
.login .msg{min-height:1.4em}
.boot{flex:1;display:grid;place-items:center;color:var(--muted);font-size:.9rem}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);padding-top:4px}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
</style>
</head>
<body>
<div class="app">

<section class="screen boot" id="boot">불러오는 중…</section>

<!-- 0. 로그인 -->
<section class="screen" id="sLogin" hidden>
  <div class="pad login">
    <div>
      <img class="logo" src="icons/icon-192.png" alt="">
      <h1>우리집 가계부</h1>
      <p>부부가 함께 쓰는 달력 가계부</p>
    </div>
    <form id="loginForm" novalidate>
      <input id="loginEmail" type="email" autocomplete="username" inputmode="email" placeholder="이메일">
      <input id="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호">
      <div class="msg" id="loginMsg" role="status"></div>
      <button class="cta" id="loginBtn" type="submit">로그인</button>
    </form>
  </div>
</section>

<!-- 1. 달력 홈 -->
<section class="screen" id="sHome" hidden>
  <div class="pad">
    <div class="hdr">
      <button class="month-btn" id="monthBtn" aria-expanded="false"><span id="monthLabel">—</span><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="hdr-icons">
        <button id="goList" aria-label="월간 내역"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <button id="goStats" aria-label="통계와 설정"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 6"/></svg></button>
        <button id="goAdd" aria-label="가계부 등록"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button>
      </div>
    </div>
    <div class="picker" id="picker" hidden>
      <div class="yr"><button id="yPrev" aria-label="이전 해">‹</button><span id="yLabel"></span><button id="yNext" aria-label="다음 해">›</button></div>
      <div class="ms" id="mGrid"></div>
    </div>
    <div class="banner" id="status" hidden></div>
    <div class="summary">
      <div><div class="k">입금</div><div class="v num" id="sIn">+0원</div></div>
      <div><div class="k">지출</div><div class="v num" id="sOut">-0원</div></div>
      <div><div class="k">잔액</div><div class="v num" id="sNet">0원</div></div>
    </div>
  </div>
  <div class="cal">
    <div class="dow"><span></span><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div id="weeks"></div>
  </div>
  <div class="daylist pad">
    <div class="budget" id="budgetBox" hidden>
      <div class="bk" id="bLabel">오늘 쓸 수 있는 돈</div>
      <div class="bv num" id="bLeft">0원</div>
      <div class="track"><i id="bBar"></i></div>
      <div class="bd num" id="bDetail"></div>
      <div class="bd" id="bNext"></div>
    </div>
    <div class="daytitle" id="dayTitle"></div>
    <div id="dayRows"></div>
    <button class="cta" id="ctaAdd">가계부 등록</button>
  </div>
</section>

<!-- 2. 금액·사용자 -->
<section class="screen" id="sWho" hidden>
  <div class="pad">
    <div class="bar">
      <button id="whoBack" aria-label="뒤로"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1>가계부 등록</h1><span></span>
    </div>
    <div class="field">
      <svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><text x="12" y="17.3" font-size="6.5" text-anchor="middle" stroke="none" fill="currentColor" font-family="sans-serif" font-weight="700">31</text></svg>
      <span class="val" id="dateVal"></span>
      <input type="date" id="dateIn" aria-label="날짜 변경">
    </div>
    <div class="field">
      <svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="8" ry="3.2"/><path d="M4 7v5c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2V7M4 12v5c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2v-5"/><path d="M9.6 6.2l.9 1.9.8-1.9.7 1.9.9-1.9M9.4 7.1h5.2" stroke-width="1.1"/></svg>
      <input id="amountIn" class="amount-in num" inputmode="numeric" autocomplete="off" placeholder="금액 입력">
    </div>
    <div class="msg" id="whoMsg" role="status"></div>
    <div class="grid" id="whoGrid"></div>
    <div class="sheet" id="addMember" hidden>
      <label>이름<input id="mName" maxlength="12" placeholder="예: 강아지, 회사"></label>
      <div class="avatars" id="mIcons"></div>
      <div class="btns"><button class="pill ghost" id="mCancel">취소</button><button class="pill" id="mSave">추가</button></div>
    </div>
  </div>
</section>

<!-- 3. 메모·카테고리 -->
<section class="screen" id="sCat" hidden>
  <div class="pad">
    <div class="bar">
      <button id="catBack" aria-label="뒤로"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tabs"><button data-t="in" aria-pressed="false">입금</button><i>/</i><button data-t="out" aria-pressed="true">지출</button></div>
      <button id="catClose" aria-label="닫기"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="field" id="whoRow" style="width:100%;text-align:left">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3.2"/><path d="M6.3 18.4c1.3-2.3 3.3-3.4 5.7-3.4s4.4 1.1 5.7 3.4"/></svg>
      <span class="val" id="whoVal"></span>
    </button>
    <div class="field dim">
      <svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="8" ry="3.2"/><path d="M4 7v5c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2V7M4 12v5c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2v-5"/></svg>
      <input id="amount2" class="num" inputmode="numeric" autocomplete="off" aria-label="금액">
    </div>
    <div class="field">
      <svg class="i" viewBox="0 0 24 24"><path d="M20 13.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19V6a1.5 1.5 0 0 1 1.5-1.5H11"/><path d="M17.5 3.5l3 3L12 15l-3.6.6.6-3.6z"/></svg>
      <input id="memoIn" maxlength="40" placeholder="사용처 (예: 커피)" autocomplete="off">
    </div>
    <div class="sugg" id="sugg" hidden></div>
    <div class="toggle-row"><span>메모 자동완성</span><button class="sw" id="acSw" role="switch" aria-checked="true" aria-label="메모 자동완성"></button></div>
    <div class="msg" id="catMsg" role="status"></div>
    <div class="grid" id="catGrid"></div>
    <button class="danger" id="delBtn" hidden>이 내역 삭제</button>
  </div>
</section>

<!-- 월간 내역 -->
<section class="screen" id="sList" hidden>
  <div class="pad">
    <div class="bar">
      <button class="back" aria-label="뒤로"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="listTitle">월간 내역</h1><span></span>
    </div>
    <div id="listBody"></div>
  </div>
</section>

<!-- 통계·설정 -->
<section class="screen" id="sStats" hidden>
  <div class="pad">
    <div class="bar">
      <button class="back" aria-label="뒤로"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="statsTitle">통계</h1><span></span>
    </div>
    <div class="section"><h2>카테고리별 지출</h2><div id="byCat"></div></div>
    <div class="section"><h2>사용자별 지출</h2><div id="byWho"></div></div>
    <div class="section">
      <h2>설정</h2>
      <div class="sheet">
        <label>하루 예산 (원)<input id="dailyIn" inputmode="numeric" placeholder="100,000"></label>
        <label>월 지출 예산 (원, 선택)<input id="budgetIn" inputmode="numeric" placeholder="예: 3,000,000"></label>
        <div id="memberEdit"></div>
        <div class="btns"><button class="pill" id="saveSettings">설정 저장</button></div>
      </div>
      <div class="acct" id="pushRow" hidden><span id="pushState">이 기기 알림 꺼짐</span><button class="pill" id="pushBtn">알림 받기</button></div>
      <div class="acct"><span id="whoami"></span><button class="pill ghost" id="logoutBtn">로그아웃</button></div>
    </div>
  </div>
</section>

</div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
