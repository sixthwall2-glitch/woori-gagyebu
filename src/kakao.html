<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카카오톡 리포트 연결</title>
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#fff;--sub:#f4f5f5;--ink:#1c1f1e;--muted:#8a908e;--line:#ebeeed;--accent:#14a3a8;--dark:#161818;--on-dark:#fff;--danger:#d64545;
  --font:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#141716;--sub:#1e2221;--ink:#eef1f0;--muted:#97a09d;--line:#262b2a;--accent:#3cc4c8;--dark:#eef1f0;--on-dark:#141716;--danger:#f07c7c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
main{max-width:420px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px));display:grid;gap:22px}
img{width:64px;height:64px;border-radius:18px}
h1{margin:0;font-size:1.4rem;letter-spacing:-.02em}
p{margin:0;color:var(--muted)}
form{display:grid;gap:10px}
input{font:inherit;font-size:1rem;color:var(--ink);background:var(--sub);border:1px solid var(--line);border-radius:12px;padding:13px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-size:1rem;border:0;border-radius:999px;padding:14px;cursor:pointer;background:var(--dark);color:var(--on-dark)}
button:disabled{opacity:.5}
.kakao{background:#fee500;color:#191919;font-weight:600}
.msg{min-height:1.4em;color:var(--danger);font-size:.9rem}
.ok{color:var(--accent)}
.card{background:var(--sub);border-radius:14px;padding:14px 16px;font-size:.92rem;display:grid;gap:4px}
a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div><img src="icons/icon-192.png" alt=""></div>
  <div>
    <h1>카카오톡 리포트 연결</h1>
    <p>연결하면 매주 월요일과 매월 1일 오전 8시에 가계부 리포트가 내 카카오톡 "나와의 채팅"으로 옵니다.</p>
  </div>
  <section id="stLogin" hidden>
    <form id="loginForm" novalidate>
      <p>먼저 가계부 계정으로 로그인하세요.</p>
      <input id="email" type="email" autocomplete="username" placeholder="이메일">
      <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
      <button id="loginBtn" type="submit">로그인</button>
    </form>
  </section>
  <section id="stConnect" hidden>
    <div class="card"><span id="who"></span><span id="state"></span></div>
    <button class="kakao" id="connectBtn" style="margin-top:14px;width:100%">카카오톡 연결하기</button>
  </section>
  <div class="msg" id="msg" role="status"></div>
  <p><a id="back" href="./">가계부로 돌아가기</a></p>
</main>
<script type="module" src="kakao.js"></script>
</body>
</html>
