name: 카카오톡 리포트

on:
  schedule:
    # 매일 22:50 UTC = 07:50 KST. GitHub 예약 실행은 보통 몇 분~수십 분 늦게 시작해 8시 전후에 도착합니다.
    - cron: "50 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "이 날짜(KST, YYYY-MM-DD)인 것처럼 실행 (비우면 오늘)"
        required: false
      dry:
        description: "보내지 않고 내용만 확인"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: 리포트 만들고 보내기
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::notice::FIREBASE_SERVICE_ACCOUNT 비밀값이 아직 없어 건너뜁니다."; exit 0; fi
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date=${{ inputs.date }}"; fi
          if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          node scripts/report.mjs $ARGS

      # 공개 저장소의 예약 실행은 60일간 활동이 없으면 GitHub이 멈춥니다. 매월 1일에 기록 한 줄을 남겨 계속 돌게 합니다.
      - name: 예약 실행 유지
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=Asia/Seoul date +%d)" = "01" ]; then
            TZ=Asia/Seoul date +%F > .github/last-report-month
            git config user.name "가계부 리포트"
            git config user.email "actions@users.noreply.github.com"
            git add .github/last-report-month
            git commit -m "리포트 예약 실행 유지 [skip ci]" && git push || true
          fi
