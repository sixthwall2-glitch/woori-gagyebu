name: 빌드 및 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  web:
    name: 웹(아이폰용) 배포
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: 안드로이드 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: 서명 키 준비
        id: key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # android/release.jks는 긴 무작위 비밀번호로 암호화되어 있고, 비밀번호는 저장소 비밀값에만 있습니다.
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "file=$GITHUB_WORKSPACE/android/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_PASSWORD 비밀값이 없어 디버그 APK로 빌드합니다."
          fi

      - name: APK 빌드
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: gagyebu
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../woori-gagyebu.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../woori-gagyebu.apk
          fi

      - uses: actions/upload-artifact@v4
        with: { name: woori-gagyebu-apk, path: woori-gagyebu.apk }

      - name: 릴리스에 APK 올리기 (폰에서 내려받는 곳)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" woori-gagyebu.apk \
            --title "우리집 가계부 v${{ github.run_number }}" \
            --notes "폰에서 woori-gagyebu.apk를 내려받아 설치하세요." --latest

  firebase:
    name: Firebase 서버 배포 (알림·규칙)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: 바뀐 부분 확인
        id: diff
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(functions/|firestore.rules|firebase.json)'; then echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.diff.outputs.go == '1'
        with: { node-version: 22 }
      - name: 배포
        if: steps.diff.outputs.go == '1'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          (cd functions && npm ci)
          npx --yes firebase-tools@15 deploy --only functions,firestore:rules --project woori-gagyebu-50d77 --force --non-interactive
